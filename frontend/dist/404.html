<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{--ink:#111111;--paper:#ffffff;--coral:#4f46e5;--lime:#6366f1;--b:2.5px solid var(--ink);--sh:5px 5px 0 var(--ink);}
  body{font-family:'Space Grotesk',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;}
  a{color:inherit;text-decoration:none;}
  .nav{border-bottom:var(--b);background:#fff;padding:0 32px;height:60px;display:flex;align-items:center;justify-content:space-between;}
  .logo{display:flex;align-items:center;gap:10px;font-family:'Archivo',sans-serif;font-size:18px;font-weight:900;}
  .logo-mark{width:32px;height:32px;background:var(--ink);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Archivo',sans-serif;font-weight:900;font-size:16px;}
  .main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 24px;}
  .code{font-family:'Archivo',sans-serif;font-size:clamp(80px,18vw,180px);font-weight:900;line-height:1;color:var(--ink);opacity:.08;position:absolute;user-select:none;}
  .content{position:relative;z-index:1;}
  .badge{display:inline-flex;align-items:center;gap:8px;background:#fff;border:var(--b);border-radius:100px;padding:6px 16px;font-size:13px;font-weight:700;margin-bottom:24px;}
  h1{font-family:'Archivo',sans-serif;font-size:clamp(32px,6vw,56px);font-weight:900;line-height:1.1;margin-bottom:16px;}
  p{font-size:18px;color:#555;max-width:420px;line-height:1.6;margin-bottom:36px;}
  .btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:14px 28px;font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:700;border-radius:10px;border:var(--b);box-shadow:var(--sh);cursor:pointer;transition:transform .1s,box-shadow .1s;text-decoration:none;}
  .btn:hover{transform:translate(2px,2px);box-shadow:3px 3px 0 var(--ink);}
  .btn-coral{background:var(--coral);color:#fff;}
  .btn-white{background:#fff;color:var(--ink);}
  .links{margin-top:48px;display:flex;gap:24px;flex-wrap:wrap;justify-content:center;}
  .links a{font-size:14px;font-weight:600;color:#666;border-bottom:2px solid transparent;transition:border-color .15s,color .15s;}
  .links a:hover{color:var(--ink);border-color:var(--ink);}
  footer{border-top:var(--b);padding:20px 32px;text-align:center;font-size:13px;color:#888;font-weight:600;}
/* ── Modern clean theme override ───────────────────────── */
:root {
  --b:  1px solid #e5e7eb;
  --b2: 1px solid #d1d5db;
  --sh:   0 2px 8px rgba(0,0,0,.06);
  --sh-sm:0 1px 4px rgba(0,0,0,.05);
  --sh-lg:0 8px 28px rgba(0,0,0,.10);
  --sh-coral:0 0 0 4px rgba(99,102,241,.15);
}

/* Typography */
body, button, input, select, textarea, p, li, span, a, label {
  font-family: 'Inter', system-ui, sans-serif !important;
}
h1, h2, h3, h4, .logo, .logo-mark, .pnum {
  font-family: 'Inter', system-ui, sans-serif !important;
  font-weight: 800 !important;
}
.stat-n { font-family: 'Inter', system-ui, sans-serif !important; }
.bm-qtitle, .foot-logo { font-family: 'Inter', system-ui, sans-serif !important; font-weight: 700 !important; }

/* Nav */
.nav { border-bottom: 1px solid #f3f4f6; box-shadow: 0 1px 3px rgba(0,0,0,.03); }
.logo-mark { border: none; box-shadow: none; }
.navlinks a { color: #374151; }

/* Buttons */
.btn { border: none !important; border-radius: 10px !important; transition: transform .15s, box-shadow .15s !important; }
.btn-lime { background: #6366f1 !important; color: #fff !important; box-shadow: 0 2px 8px rgba(99,102,241,.3) !important; }
.btn-lime:hover { transform: translateY(-1px) !important; box-shadow: 0 6px 20px rgba(99,102,241,.4) !important; }
.btn-coral { background: #4f46e5 !important; color: #fff !important; box-shadow: 0 2px 8px rgba(79,70,229,.3) !important; }
.btn-coral:hover { transform: translateY(-1px) !important; box-shadow: 0 6px 20px rgba(79,70,229,.4) !important; }
.btn-white { background: #fff !important; color: #111 !important; border: 1px solid #e5e7eb !important; box-shadow: 0 1px 3px rgba(0,0,0,.06) !important; }
.btn-white:hover { transform: translateY(-1px) !important; box-shadow: 0 4px 12px rgba(0,0,0,.10) !important; }
.btn-dark { background: #111 !important; color: #fff !important; box-shadow: 0 2px 8px rgba(0,0,0,.15) !important; }
.btn-dark:hover { transform: translateY(-1px) !important; box-shadow: 0 6px 20px rgba(0,0,0,.25) !important; }

/* Badges */
.badge { border: none !important; box-shadow: none !important; border-radius: 99px !important; font-weight: 600 !important; }
.badge-sky { background: #eef2ff !important; color: #4f46e5 !important; }
.badge-lime { background: #eef2ff !important; color: #6366f1 !important; }
.badge-violet { background: #ede9fe !important; color: #7c3aed !important; }
.badge-coral { background: #eef2ff !important; color: #4f46e5 !important; }

/* Hero cards */
.hv-card { border: 1px solid #e5e7eb !important; box-shadow: 0 8px 24px rgba(0,0,0,.08) !important; }
.hv-card.front { box-shadow: 0 16px 40px rgba(99,102,241,.15) !important; }
.hv-bar { background: #6366f1 !important; }
.hv-lbl { border: none !important; box-shadow: none !important; background: #eef2ff !important; color: #4f46e5 !important; }
.hv-opt { border: 1px solid #e5e7eb !important; }
.hv-opt.sel { border-color: #6366f1 !important; background: #eef2ff !important; color: #4f46e5 !important; box-shadow: none !important; }
.hv-opt.sel .hv-dot { background: #6366f1 !important; border-color: #6366f1 !important; }

/* Feature grid */
.feat-grid { border: 1px solid #e5e7eb !important; box-shadow: none; }
.feat { border-right: 1px solid #e5e7eb !important; border-bottom: 1px solid #e5e7eb !important; }
.feat:nth-child(3n) { border-right: none !important; }
.feat:nth-child(n+4) { border-bottom: none !important; }
.feat-num { border: none !important; box-shadow: none !important; border-radius: 12px !important; }
.feat:hover { transform: translateY(-3px) !important; box-shadow: 0 6px 20px rgba(0,0,0,.08) !important; background: #fafafa !important; }
@media(max-width:600px){
  .feat { border-right: none !important; }
}

/* Two-col builder mock */
.bm { border: 1px solid #e5e7eb !important; box-shadow: 0 16px 40px rgba(0,0,0,.10) !important; }
.bm-l { border-right: 1px solid #e5e7eb !important; }

/* Comparison */

.ccard:hover { transform: translateY(-2px) !important; box-shadow: 0 8px 24px rgba(0,0,0,.10) !important; }
.ccard.good:hover { box-shadow: 0 8px 24px rgba(99,102,241,.20) !important; }

/* Templates */
.ttab { border: 1px solid #e5e7eb !important; box-shadow: none !important; }
.ttab:hover { transform: none !important; box-shadow: none !important; background: #f9fafb !important; }
.ttab.on { background: #6366f1 !important; color: #fff !important; border-color: #6366f1 !important; box-shadow: 0 2px 8px rgba(99,102,241,.3) !important; }

.tcard:hover { transform: translateY(-3px) !important; box-shadow: 0 8px 24px rgba(0,0,0,.10) !important; }
.tcard-pre { border-bottom: 1px solid #f3f4f6 !important; }

/* Testimonials */
.testi { border: 1px solid #e5e7eb !important; box-shadow: 0 2px 8px rgba(0,0,0,.06) !important; border-radius: 16px !important; }
.testi:hover { transform: translateY(-3px) !important; box-shadow: 0 8px 24px rgba(0,0,0,.10) !important; }
.testi-av { border: 2px solid #e5e7eb !important; }

/* Pricing */
.pcard { border: 1px solid rgba(255,255,255,.1) !important; border-radius: 16px !important; }
.pcard.pop { background: #fff !important; border: 2px solid #6366f1 !important; box-shadow: 0 0 0 4px rgba(99,102,241,.12), 0 16px 40px rgba(99,102,241,.15) !important; }
.pop-badge { background: #6366f1 !important; border: none !important; box-shadow: none !important; }
.pcard .btn { border-radius: 10px !important; }
.pcard:not(.pop) .pfeats li::before { color: #818cf8 !important; }
.pcard.pop .pfeats li::before { color: #6366f1 !important; }
.ptog.on { background: #6366f1 !important; color: #fff !important; }

/* Integrations marquee */
.mq-wrap { border-top: 1px solid #f3f4f6 !important; border-bottom: 1px solid #f3f4f6 !important; }
.int-pill { border: 1px solid #e5e7eb !important; box-shadow: none !important; border-radius: 99px !important; }

/* Chips */
.chip { border: 1px solid #e5e7eb !important; box-shadow: none !important; border-radius: 10px !important; font-weight: 600 !important; }
.chip:hover { transform: translateY(-1px) !important; box-shadow: 0 4px 12px rgba(0,0,0,.08) !important; }

/* Modal */
.modal { border: 1px solid #e5e7eb !important; box-shadow: 0 24px 48px rgba(0,0,0,.15) !important; border-radius: 20px !important; }
.modal-head { border-bottom: 1px solid #f3f4f6 !important; }
.modal-close { border: 1px solid #e5e7eb !important; box-shadow: none !important; border-radius: 8px !important; }
.modal-close:hover { transform: none !important; box-shadow: none !important; background: #f9fafb !important; }
.modal-foot { border-top: 1px solid #f3f4f6 !important; }
.q-item { border: 1px solid #e5e7eb !important; box-shadow: 0 1px 3px rgba(0,0,0,.05) !important; border-radius: 10px !important; }
.q-item:hover { transform: none !important; box-shadow: 0 4px 12px rgba(0,0,0,.08) !important; }
.q-num { background: #eef2ff !important; border: none !important; color: #6366f1 !important; }
.q-badge { background: #eef2ff !important; border: none !important; color: #4f46e5 !important; }
.add-q-sel { border: 1px solid #e5e7eb !important; }
.add-q-sel:focus { border-color: #6366f1 !important; }

/* Footer */
footer { border-top: none !important; }
.foot-logo { font-weight: 700 !important; }

/* Section strip borders */
.testi-strip { border-top: 1px solid #f3f4f6 !important; border-bottom: 1px solid #f3f4f6 !important; }
.ai-strip { border-top: 1px solid #f3f4f6 !important; border-bottom: 1px solid #f3f4f6 !important; }
.trust { border-bottom: 1px solid #f3f4f6 !important; }
.hero { border-bottom: 1px solid #f3f4f6 !important; }
.stats { border-bottom: 1px solid rgba(255,255,255,.05) !important; }
.final { border-top: 1px solid #f3f4f6 !important; }
.divider { border-top: 1px solid #e5e7eb !important; }

</style>

<!DOCTYPE html>
<html lang="en">
<head>
<title>FormFlowX API Endpoints</title>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" />
<style>
  :root {
    --bg: #ffffff; --ink: #111111; --surface: #FFFFFF;
    --border: #111111; --lime: #6366f1; --orange: #f97316;
    --muted: #6B6B4F; --danger: #ef4444;
    --shadow: 3px 3px 0 var(--ink); --shadow-sm: 2px 2px 0 var(--ink);
    --radius: 4px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1C1C10; --ink: #ffffff; --surface: #2A2A18;
      --border: #ffffff; --muted: #A8A880;
    }
  }
  :root[data-theme="dark"] { --bg: #1C1C10; --ink: #ffffff; --surface: #2A2A18; --border: #ffffff; --muted: #A8A880; }
  :root[data-theme="light"] { --bg: #ffffff; --ink: #111111; --surface: #FFFFFF; --border: #111111; --muted: #6B6B4F; }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Space Grotesk', sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; font-size: 14px; }

  /* login */
  #login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .login-card { background: var(--surface); border: 2px solid var(--border); box-shadow: var(--shadow); border-radius: var(--radius); padding: 40px; width: 100%; max-width: 400px; }
  .logo-row { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
  .logo-icon { width: 36px; height: 36px; background: var(--ink); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
  .logo-icon svg { color: var(--bg); }
  .logo-name { font-size: 15px; font-weight: 700; }
  .logo-sub { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; font-weight: 600; }
  .page-title { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
  .page-sub { font-size: 13px; color: var(--muted); margin-bottom: 24px; }

  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .field label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; }
  .field input { border: 2px solid var(--border); border-radius: var(--radius); padding: 10px 12px; font-family: inherit; font-size: 14px; background: var(--bg); color: var(--ink); outline: none; }
  .field input:focus { box-shadow: var(--shadow-sm); }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 10px 18px; font-family: inherit; font-size: 13px; font-weight: 600; border: 2px solid var(--border); border-radius: var(--radius); cursor: pointer; transition: box-shadow 0.1s, transform 0.1s; background: var(--surface); color: var(--ink); }
  .btn:hover:not(:disabled) { box-shadow: var(--shadow-sm); transform: translate(-1px,-1px); }
  .btn:active:not(:disabled) { box-shadow: none; transform: translate(0,0); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-primary { background: var(--lime); width: 100%; }
  .btn-lime { background: var(--lime); }
  .btn-danger { background: #fee2e2; border-color: #991b1b; color: #991b1b; }
  .btn-ghost { background: transparent; border-color: transparent; }

  .err { background: #fee2e2; border: 2px solid #991b1b; border-radius: var(--radius); padding: 10px 14px; font-size: 13px; color: #991b1b; margin-bottom: 14px; display: none; }

  /* header */
  header { background: var(--ink); color: var(--bg); height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; position: sticky; top: 0; z-index: 100; }
  .h-left { display: flex; align-items: center; gap: 12px; }
  .h-logo { display: flex; align-items: center; gap: 8px; }
  .h-logo-icon { width: 28px; height: 28px; background: var(--lime); border-radius: 6px; display: flex; align-items: center; justify-content: center; }
  .h-logo-icon svg { color: #111; }
  .h-logo-name { font-size: 14px; font-weight: 700; color: var(--bg); }
  .badge { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; background: var(--lime); color: #111; padding: 3px 8px; border-radius: 3px; }
  .h-right { display: flex; align-items: center; gap: 10px; }
  .h-email { font-size: 12px; color: #A8A880; }
  .h-signout { background: transparent; border: 1.5px solid #A8A880; color: #A8A880; border-radius: 4px; padding: 5px 12px; font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer; }
  .h-signout:hover { border-color: var(--bg); color: var(--bg); }

  /* app */
  #app-screen { display: none; flex-direction: column; min-height: 100vh; }
  main { padding: 28px 24px; max-width: 900px; width: 100%; margin: 0 auto; }

  /* top bar */
  .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
  .top-bar h1 { font-size: 22px; font-weight: 700; }
  .top-bar p { font-size: 13px; color: var(--muted); margin-top: 2px; }

  /* create form */
  .create-card { background: var(--surface); border: 2px solid var(--border); box-shadow: var(--shadow); border-radius: var(--radius); padding: 22px; margin-bottom: 28px; }
  .create-card h2 { font-size: 14px; font-weight: 700; margin-bottom: 14px; }
  .create-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .create-row .field { flex: 1; min-width: 180px; margin: 0; }
  .create-row .field input { font-size: 13px; padding: 9px 11px; }

  /* endpoint cards */
  .endpoints-list { display: flex; flex-direction: column; gap: 16px; }
  .endpoint-card { background: var(--surface); border: 2px solid var(--border); box-shadow: var(--shadow); border-radius: var(--radius); overflow: hidden; }
  .endpoint-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid color-mix(in srgb, var(--border) 20%, transparent); gap: 12px; flex-wrap: wrap; }
  .endpoint-name { font-size: 15px; font-weight: 700; }
  .endpoint-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .endpoint-actions { display: flex; gap: 8px; align-items: center; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; flex-shrink: 0; }
  .status-dot.off { background: #d1d5db; }

  .endpoint-body { padding: 16px 20px; }
  .snippet-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin-bottom: 8px; }
  .code-block { background: #1e1e2e; color: #cdd6f4; border-radius: var(--radius); padding: 14px 16px; font-family: 'Courier New', monospace; font-size: 12px; line-height: 1.6; overflow-x: auto; position: relative; margin-bottom: 14px; }
  .code-block .kw { color: #89b4fa; }
  .code-block .attr { color: #a6e3a1; }
  .code-block .val { color: #f38ba8; }
  .code-block .cm { color: #585b70; }
  .copy-btn { position: absolute; top: 10px; right: 10px; background: #313244; border: none; border-radius: 4px; padding: 5px 10px; color: #cdd6f4; font-size: 11px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .copy-btn:hover { background: #45475a; }
  .copy-btn.copied { background: #a6e3a1; color: #1e1e2e; }

  /* key row */
  .key-row { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .key-val { font-family: monospace; font-size: 12px; background: color-mix(in srgb, var(--lime) 15%, transparent); border: 1.5px solid color-mix(in srgb, var(--ink) 30%, transparent); border-radius: 4px; padding: 5px 10px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* submissions table */
  .submissions-toggle { background: none; border: none; color: var(--ink); font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; padding: 0; }
  .submissions-toggle svg { transition: transform 0.2s; }
  .submissions-toggle.open svg { transform: rotate(90deg); }
  .sub-table-wrap { margin-top: 14px; overflow-x: auto; border: 1px solid color-mix(in srgb, var(--border) 30%, transparent); border-radius: var(--radius); display: none; }
  .sub-table-wrap.open { display: block; }
  table { width: 100%; border-collapse: collapse; }
  th { padding: 9px 12px; text-align: left; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); background: var(--bg); border-bottom: 1px solid color-mix(in srgb, var(--border) 25%, transparent); white-space: nowrap; }
  td { padding: 10px 12px; font-size: 13px; border-bottom: 1px solid color-mix(in srgb, var(--border) 15%, transparent); }
  tbody tr:last-child td { border-bottom: none; }
  .sub-data { font-family: monospace; font-size: 11px; color: var(--muted); max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sub-date { font-size: 11px; color: var(--muted); white-space: nowrap; }

  .empty-state { text-align: center; padding: 48px 24px; color: var(--muted); }
  .empty-state p { font-size: 13px; }

  #loading-screen { display: none; min-height: 100vh; align-items: center; justify-content: center; gap: 14px; flex-direction: column; }
  .spinner { width: 32px; height: 32px; border: 3px solid color-mix(in srgb, var(--ink) 20%, transparent); border-top-color: var(--ink); border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2s; } }

  .toggle-switch { position: relative; width: 36px; height: 20px; flex-shrink: 0; }
  .toggle-switch input { opacity: 0; width: 0; height: 0; }
  .toggle-track { position: absolute; inset: 0; background: #d1d5db; border-radius: 20px; cursor: pointer; transition: background 0.2s; border: 2px solid var(--border); }
  .toggle-track::before { content: ''; position: absolute; width: 12px; height: 12px; background: #fff; border-radius: 50%; top: 2px; left: 2px; transition: transform 0.2s; }
  input:checked + .toggle-track { background: var(--lime); }
  input:checked + .toggle-track::before { transform: translateX(16px); background: var(--ink); }

  @media (max-width: 600px) { main { padding: 16px; } .create-row { flex-direction: column; } }
/* ── Modern clean theme override ───────────────────────── */
:root {
  --b:  1px solid #e5e7eb;
  --b2: 1px solid #d1d5db;
  --sh:   0 2px 8px rgba(0,0,0,.06);
  --sh-sm:0 1px 4px rgba(0,0,0,.05);
  --sh-lg:0 8px 28px rgba(0,0,0,.10);
  --sh-coral:0 0 0 4px rgba(99,102,241,.15);
}

/* Typography */
body, button, input, select, textarea, p, li, span, a, label {
  font-family: 'Inter', system-ui, sans-serif !important;
}
h1, h2, h3, h4, .logo, .logo-mark, .pnum {
  font-family: 'Inter', system-ui, sans-serif !important;
  font-weight: 800 !important;
}
.stat-n { font-family: 'Inter', system-ui, sans-serif !important; }
.bm-qtitle, .foot-logo { font-family: 'Inter', system-ui, sans-serif !important; font-weight: 700 !important; }

/* Nav */
.nav { border-bottom: 1px solid #f3f4f6; box-shadow: 0 1px 3px rgba(0,0,0,.03); }
.logo-mark { border: none; box-shadow: none; }
.navlinks a { color: #374151; }

/* Buttons */
.btn { border: none !important; border-radius: 10px !important; transition: transform .15s, box-shadow .15s !important; }
.btn-lime { background: #6366f1 !important; color: #fff !important; box-shadow: 0 2px 8px rgba(99,102,241,.3) !important; }
.btn-lime:hover { transform: translateY(-1px) !important; box-shadow: 0 6px 20px rgba(99,102,241,.4) !important; }
.btn-coral { background: #4f46e5 !important; color: #fff !important; box-shadow: 0 2px 8px rgba(79,70,229,.3) !important; }
.btn-coral:hover { transform: translateY(-1px) !important; box-shadow: 0 6px 20px rgba(79,70,229,.4) !important; }
.btn-white { background: #fff !important; color: #111 !important; border: 1px solid #e5e7eb !important; box-shadow: 0 1px 3px rgba(0,0,0,.06) !important; }
.btn-white:hover { transform: translateY(-1px) !important; box-shadow: 0 4px 12px rgba(0,0,0,.10) !important; }
.btn-dark { background: #111 !important; color: #fff !important; box-shadow: 0 2px 8px rgba(0,0,0,.15) !important; }
.btn-dark:hover { transform: translateY(-1px) !important; box-shadow: 0 6px 20px rgba(0,0,0,.25) !important; }

/* Badges */
.badge { border: none !important; box-shadow: none !important; border-radius: 99px !important; font-weight: 600 !important; }
.badge-sky { background: #eef2ff !important; color: #4f46e5 !important; }
.badge-lime { background: #eef2ff !important; color: #6366f1 !important; }
.badge-violet { background: #ede9fe !important; color: #7c3aed !important; }
.badge-coral { background: #eef2ff !important; color: #4f46e5 !important; }

/* Hero cards */
.hv-card { border: 1px solid #e5e7eb !important; box-shadow: 0 8px 24px rgba(0,0,0,.08) !important; }
.hv-card.front { box-shadow: 0 16px 40px rgba(99,102,241,.15) !important; }
.hv-bar { background: #6366f1 !important; }
.hv-lbl { border: none !important; box-shadow: none !important; background: #eef2ff !important; color: #4f46e5 !important; }
.hv-opt { border: 1px solid #e5e7eb !important; }
.hv-opt.sel { border-color: #6366f1 !important; background: #eef2ff !important; color: #4f46e5 !important; box-shadow: none !important; }
.hv-opt.sel .hv-dot { background: #6366f1 !important; border-color: #6366f1 !important; }

/* Feature grid */
.feat-grid { border: 1px solid #e5e7eb !important; box-shadow: none; }
.feat { border-right: 1px solid #e5e7eb !important; border-bottom: 1px solid #e5e7eb !important; }
.feat:nth-child(3n) { border-right: none !important; }
.feat:nth-child(n+4) { border-bottom: none !important; }
.feat-num { border: none !important; box-shadow: none !important; border-radius: 12px !important; }
.feat:hover { transform: translateY(-3px) !important; box-shadow: 0 6px 20px rgba(0,0,0,.08) !important; background: #fafafa !important; }
@media(max-width:600px){
  .feat { border-right: none !important; }
}

/* Two-col builder mock */
.bm { border: 1px solid #e5e7eb !important; box-shadow: 0 16px 40px rgba(0,0,0,.10) !important; }
.bm-l { border-right: 1px solid #e5e7eb !important; }
.bm-r { border-left: 1px solid #e5e7eb !important; }
.bm-q { border: 1px solid #e5e7eb !important; box-shadow: 0 2px 8px rgba(0,0,0,.06) !important; }

/* Analytics mock */
.an-mock { border: 1px solid #e5e7eb !important; box-shadow: 0 2px 8px rgba(0,0,0,.06) !important; }
.an-track { border: none !important; }

/* AI section */
.ai-prompt { border: none !important; box-shadow: none !important; border-radius: 16px !important; }
.ai-card { border: 1px solid #e5e7eb !important; box-shadow: 0 1px 4px rgba(0,0,0,.05) !important; border-radius: 12px !important; }
.ai-card:hover { transform: translateY(-2px) !important; box-shadow: 0 6px 20px rgba(99,102,241,.12) !important; }

/* Comparison */
.ctab { border: 1px solid #e5e7eb !important; box-shadow: none !important; }
.ctab:hover { transform: none !important; box-shadow: none !important; background: #f9fafb !important; }
.ctab.on { background: #6366f1 !important; color: #fff !important; border-color: #6366f1 !important; box-shadow: 0 2px 8px rgba(99,102,241,.3) !important; }
.ccard { border: 1px solid #e5e7eb !important; box-shadow: 0 2px 8px rgba(0,0,0,.06) !important; border-radius: 16px !important; }
.ccard.good { border: 2px solid #6366f1 !important; box-shadow: 0 4px 16px rgba(99,102,241,.12) !important; }
.ccard:hover { transform: translateY(-2px) !important; box-shadow: 0 8px 24px rgba(0,0,0,.10) !important; }
.ccard.good:hover { box-shadow: 0 8px 24px rgba(99,102,241,.20) !important; }

/* Templates */
.ttab { border: 1px solid #e5e7eb !important; box-shadow: none !important; }
.ttab:hover { transform: none !important; box-shadow: none !important; background: #f9fafb !important; }
.ttab.on { background: #6366f1 !important; color: #fff !important; border-color: #6366f1 !important; box-shadow: 0 2px 8px rgba(99,102,241,.3) !important; }
.tcard { border: 1px solid #e5e7eb !important; box-shadow: 0 2px 8px rgba(0,0,0,.06) !important; border-radius: 16px !important; }
.tcard:hover { transform: translateY(-3px) !important; box-shadow: 0 8px 24px rgba(0,0,0,.10) !important; }
.tcard-pre { border-bottom: 1px solid #f3f4f6 !important; }

/* Testimonials */
.testi { border: 1px solid #e5e7eb !important; box-shadow: 0 2px 8px rgba(0,0,0,.06) !important; border-radius: 16px !important; }
.testi:hover { transform: translateY(-3px) !important; box-shadow: 0 8px 24px rgba(0,0,0,.10) !important; }
.testi-av { border: 2px solid #e5e7eb !important; }
.testi-stars { color: #f59e0b !important; }

/* Pricing */
.pcard { border: 1px solid rgba(255,255,255,.1) !important; border-radius: 16px !important; }
.pcard.pop { background: #fff !important; border: 2px solid #6366f1 !important; box-shadow: 0 0 0 4px rgba(99,102,241,.12), 0 16px 40px rgba(99,102,241,.15) !important; }
.pop-badge { background: #6366f1 !important; border: none !important; box-shadow: none !important; }
.pcard .btn { border-radius: 10px !important; }
.pcard:not(.pop) .pfeats li::before { color: #818cf8 !important; }
.pcard.pop .pfeats li::before { color: #6366f1 !important; }
.ptog.on { background: #6366f1 !important; color: #fff !important; }

/* Integrations marquee */
.mq-wrap { border-top: 1px solid #f3f4f6 !important; border-bottom: 1px solid #f3f4f6 !important; }
.int-pill { border: 1px solid #e5e7eb !important; box-shadow: none !important; border-radius: 99px !important; }

/* Chips */
.chip { border: 1px solid #e5e7eb !important; box-shadow: none !important; border-radius: 10px !important; font-weight: 600 !important; }
.chip:hover { transform: translateY(-1px) !important; box-shadow: 0 4px 12px rgba(0,0,0,.08) !important; }

/* Modal */
.modal { border: 1px solid #e5e7eb !important; box-shadow: 0 24px 48px rgba(0,0,0,.15) !important; border-radius: 20px !important; }
.modal-head { border-bottom: 1px solid #f3f4f6 !important; }
.modal-close { border: 1px solid #e5e7eb !important; box-shadow: none !important; border-radius: 8px !important; }
.modal-close:hover { transform: none !important; box-shadow: none !important; background: #f9fafb !important; }
.modal-foot { border-top: 1px solid #f3f4f6 !important; }
.q-item { border: 1px solid #e5e7eb !important; box-shadow: 0 1px 3px rgba(0,0,0,.05) !important; border-radius: 10px !important; }
.q-item:hover { transform: none !important; box-shadow: 0 4px 12px rgba(0,0,0,.08) !important; }
.q-num { background: #eef2ff !important; border: none !important; color: #6366f1 !important; }
.q-badge { background: #eef2ff !important; border: none !important; color: #4f46e5 !important; }
.add-q-sel { border: 1px solid #e5e7eb !important; }
.add-q-sel:focus { border-color: #6366f1 !important; }

/* Footer */
footer { border-top: none !important; }
.foot-logo { font-weight: 700 !important; }

/* Section strip borders */
.testi-strip { border-top: 1px solid #f3f4f6 !important; border-bottom: 1px solid #f3f4f6 !important; }
.ai-strip { border-top: 1px solid #f3f4f6 !important; border-bottom: 1px solid #f3f4f6 !important; }
.trust { border-bottom: 1px solid #f3f4f6 !important; }
.hero { border-bottom: 1px solid #f3f4f6 !important; }
.stats { border-bottom: 1px solid rgba(255,255,255,.05) !important; }
.final { border-top: 1px solid #f3f4f6 !important; }
.divider { border-top: 1px solid #e5e7eb !important; }

</style>
</head>
<body>

<div id="loading-screen"><div class="spinner"></div><div style="font-size:13px;color:var(--muted);">Loading…</div></div>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="logo-row">
      <div class="logo-icon"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></div>
      <div><div class="logo-name">FormFlowX</div><div class="logo-sub">API Endpoints</div></div>
    </div>
    <div class="page-title">Sign in</div>
    <div class="page-sub">Sign in to manage your form endpoints and access keys.</div>
    <div id="login-err" class="err"></div>
    <div class="field"><label>Email</label><input type="email" id="l-email" placeholder="you@example.com" autocomplete="email" /></div>
    <div class="field"><label>Password</label><input type="password" id="l-pass" placeholder="••••••••" autocomplete="current-password" /></div>
    <button class="btn btn-primary" id="login-btn">Sign In</button>
  </div>
</div>

<!-- APP -->
<div id="app-screen">
  <header>
    <div class="h-left">
      <div class="h-logo">
        <div class="h-logo-icon"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></div>
        <span class="h-logo-name">FormFlowX</span>
      </div>
      <span class="badge">API</span>
    </div>
    <div class="h-right">
      <span class="h-email" id="h-email"></span>
      <button class="h-signout" id="signout-btn">Sign out</button>
    </div>
  </header>

  <main>
    <div class="top-bar">
      <div>
        <h1>API Endpoints</h1>
        <p>Point any HTML form here — FormFlowX stores submissions and emails you.</p>
      </div>
    </div>

    <!-- Create new endpoint -->
    <div class="create-card">
      <h2>Create new endpoint</h2>
      <div class="create-row">
        <div class="field"><label>Form name</label><input type="text" id="new-name" placeholder="Contact form" /></div>
        <div class="field"><label>Notify email</label><input type="email" id="new-email" placeholder="you@example.com" /></div>
        <div style="display:flex;align-items:flex-end;padding-bottom:0;">
          <button class="btn btn-lime" id="create-btn" style="height:40px;white-space:nowrap;">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
            Create
          </button>
        </div>
      </div>
      <div id="create-err" class="err" style="margin-top:10px;margin-bottom:0;"></div>
    </div>

    <!-- Endpoints list -->
    <div class="endpoints-list" id="endpoints-list">
      <div class="empty-state"><p>No endpoints yet. Create one above.</p></div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://jtorvpbucnxmysqpsbue.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp0b3J2cGJ1Y254bXlzcXBzYnVlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ1OTQ4NTcsImV4cCI6MjEwMDE3MDg1N30.87J54O_jn-h4Fbr1_qIqx_fQl4OJbARRZBlTf9DwLcE';
const API_BASE = 'https://api.formflowx.com';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let session = null;

function show(id) { document.getElementById(id).style.display = 'flex'; }
function hide(id) { document.getElementById(id).style.display = 'none'; }
function showScreen(name) {
  ['loading-screen','login-screen','app-screen'].forEach(id => document.getElementById(id).style.display = 'none');
  const el = document.getElementById(name);
  el.style.display = name === 'app-screen' ? 'flex' : 'flex';
  if (name === 'app-screen') el.style.flexDirection = 'column';
}
function setErr(id, msg) { const el = document.getElementById(id); el.textContent = msg; el.style.display = msg ? 'block' : 'none'; }

function fmtDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleString('en-IN', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
}

function copyText(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    const orig = btn.textContent;
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 1800);
  });
}

function buildSnippet(key, apiBase) {
  return `&lt;<span class="kw">form</span>
  <span class="attr">action</span>=<span class="val">"${apiBase}/submit"</span>
  <span class="attr">method</span>=<span class="val">"POST"</span>&gt;

  &lt;<span class="kw">input</span> <span class="attr">type</span>=<span class="val">"hidden"</span>
         <span class="attr">name</span>=<span class="val">"access_key"</span>
         <span class="attr">value</span>=<span class="val">"${key}"</span>&gt;

  &lt;<span class="kw">input</span> <span class="attr">type</span>=<span class="val">"text"</span> <span class="attr">name</span>=<span class="val">"name"</span> <span class="attr">placeholder</span>=<span class="val">"Your name"</span>&gt;
  &lt;<span class="kw">input</span> <span class="attr">type</span>=<span class="val">"email"</span> <span class="attr">name</span>=<span class="val">"email"</span> <span class="attr">placeholder</span>=<span class="val">"Email"</span>&gt;
  &lt;<span class="kw">textarea</span> <span class="attr">name</span>=<span class="val">"message"</span>&gt;&lt;/<span class="kw">textarea</span>&gt;

  <span class="cm">&lt;!-- Optional: redirect after submit --&gt;</span>
  &lt;<span class="kw">input</span> <span class="attr">type</span>=<span class="val">"hidden"</span> <span class="attr">name</span>=<span class="val">"_redirect"</span>
         <span class="attr">value</span>=<span class="val">"https://yoursite.com/thanks"</span>&gt;

  &lt;<span class="kw">button</span> <span class="attr">type</span>=<span class="val">"submit"</span>&gt;Send&lt;/<span class="kw">button</span>&gt;
&lt;/<span class="kw">form</span>&gt;`;
}

async function apiRequest(path, opts = {}) {
  const token = session?.access_token;
  const res = await fetch(`${API_BASE}${path}`, {
    ...opts,
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${token}`,
      ...(opts.headers || {}),
    },
  });
  return res.json();
}

async function loadEndpoints() {
  const data = await apiRequest('/api/endpoints');
  renderEndpoints(Array.isArray(data) ? data : []);
}

function renderEndpoints(endpoints) {
  const list = document.getElementById('endpoints-list');
  if (!endpoints.length) {
    list.innerHTML = '<div class="empty-state"><p>No endpoints yet. Create one above.</p></div>';
    return;
  }
  list.innerHTML = endpoints.map(ep => `
    <div class="endpoint-card" id="ep-${ep.id}">
      <div class="endpoint-header">
        <div style="display:flex;align-items:center;gap:10px;flex:1;min-width:0;">
          <div class="status-dot ${ep.active ? '' : 'off'}"></div>
          <div style="min-width:0;">
            <div class="endpoint-name">${ep.name}</div>
            <div class="endpoint-meta">Notify → ${ep.email_to || '(no email set)'} · Created ${fmtDate(ep.created_at)}</div>
          </div>
        </div>
        <div class="endpoint-actions">
          <label class="toggle-switch" title="${ep.active ? 'Disable' : 'Enable'} endpoint">
            <input type="checkbox" ${ep.active ? 'checked' : ''} onchange="toggleEndpoint('${ep.id}', this.checked)" />
            <span class="toggle-track"></span>
          </label>
          <button class="btn btn-danger" style="padding:6px 12px;font-size:12px;" onclick="deleteEndpoint('${ep.id}')">Delete</button>
        </div>
      </div>
      <div class="endpoint-body">
        <div class="snippet-label">Your access key</div>
        <div class="key-row">
          <div class="key-val" id="key-${ep.id}">${ep.access_key}</div>
          <button class="btn" style="padding:6px 12px;font-size:12px;flex-shrink:0;" onclick="copyText('${ep.access_key}', this)">Copy key</button>
        </div>
        <div class="snippet-label">HTML snippet</div>
        <div class="code-block">
          <button class="copy-btn" onclick="copyText(getRawSnippet('${ep.access_key}'), this)">Copy</button>
          ${buildSnippet(ep.access_key, API_BASE)}
        </div>
        <button class="submissions-toggle" id="tog-${ep.id}" onclick="toggleSubs('${ep.id}')">
          <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
          View submissions
        </button>
        <div class="sub-table-wrap" id="subs-${ep.id}"></div>
      </div>
    </div>
  `).join('');
}

function getRawSnippet(key) {
  return `<form action="${API_BASE}/submit" method="POST">\n  <input type="hidden" name="access_key" value="${key}">\n\n  <input type="text" name="name" placeholder="Your name">\n  <input type="email" name="email" placeholder="Email">\n  <textarea name="message"></textarea>\n\n  <input type="hidden" name="_redirect" value="https://yoursite.com/thanks">\n\n  <button type="submit">Send</button>\n</form>`;
}

async function toggleSubs(id) {
  const tog = document.getElementById(`tog-${id}`);
  const wrap = document.getElementById(`subs-${id}`);
  const isOpen = wrap.classList.contains('open');
  if (isOpen) {
    wrap.classList.remove('open');
    tog.classList.remove('open');
    return;
  }
  tog.classList.add('open');
  wrap.classList.add('open');
  wrap.innerHTML = '<p style="padding:16px;font-size:13px;color:var(--muted);">Loading…</p>';

  const result = await apiRequest(`/api/endpoints/${id}/submissions?limit=50`);
  const subs = result.submissions || [];

  if (!subs.length) {
    wrap.innerHTML = '<p style="padding:16px;font-size:13px;color:var(--muted);">No submissions yet.</p>';
    return;
  }

  const allKeys = [...new Set(subs.flatMap(s => Object.keys(s.data || {})))];
  wrap.innerHTML = `
    <table>
      <thead><tr>
        <th>#</th>
        ${allKeys.map(k => `<th>${k}</th>`).join('')}
        <th>Origin</th>
        <th>Date</th>
      </tr></thead>
      <tbody>
        ${subs.map((s, i) => `
          <tr>
            <td style="color:var(--muted);font-size:11px;">${i + 1}</td>
            ${allKeys.map(k => `<td>${s.data?.[k] ?? '—'}</td>`).join('')}
            <td class="sub-date">${s.origin ? new URL(s.origin).hostname : '—'}</td>
            <td class="sub-date">${fmtDate(s.created_at)}</td>
          </tr>`).join('')}
      </tbody>
    </table>`;
}

async function toggleEndpoint(id, active) {
  await apiRequest(`/api/endpoints/${id}`, { method: 'PATCH', body: JSON.stringify({ active }) });
  const dot = document.querySelector(`#ep-${id} .status-dot`);
  if (dot) dot.classList.toggle('off', !active);
}

async function deleteEndpoint(id) {
  if (!confirm('Delete this endpoint? All submissions will also be deleted.')) return;
  await apiRequest(`/api/endpoints/${id}`, { method: 'DELETE' });
  const el = document.getElementById(`ep-${id}`);
  if (el) el.remove();
  if (!document.querySelector('.endpoint-card')) {
    document.getElementById('endpoints-list').innerHTML = '<div class="empty-state"><p>No endpoints yet. Create one above.</p></div>';
  }
}

document.getElementById('create-btn').addEventListener('click', async () => {
  const name = document.getElementById('new-name').value.trim();
  const email_to = document.getElementById('new-email').value.trim();
  setErr('create-err', '');
  if (!name) { setErr('create-err', 'Form name is required.'); return; }

  const btn = document.getElementById('create-btn');
  btn.disabled = true; btn.textContent = 'Creating…';

  const data = await apiRequest('/api/endpoints', { method: 'POST', body: JSON.stringify({ name, email_to }) });
  btn.disabled = false; btn.innerHTML = '<svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> Create';

  if (data.error) { setErr('create-err', data.error); return; }

  document.getElementById('new-name').value = '';
  document.getElementById('new-email').value = '';
  await loadEndpoints();
});

document.getElementById('new-name').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('create-btn').click(); });

document.getElementById('login-btn').addEventListener('click', async () => {
  const email = document.getElementById('l-email').value.trim();
  const pass = document.getElementById('l-pass').value;
  setErr('login-err', '');
  if (!email || !pass) { setErr('login-err', 'Enter your email and password.'); return; }
  const btn = document.getElementById('login-btn');
  btn.textContent = 'Signing in…'; btn.disabled = true;
  const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
  btn.textContent = 'Sign In'; btn.disabled = false;
  if (error) { setErr('login-err', error.message); return; }
  session = data.session;
  document.getElementById('h-email').textContent = data.user.email;
  showScreen('app-screen');
  loadEndpoints();
});
document.getElementById('l-pass').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('login-btn').click(); });

document.getElementById('signout-btn').addEventListener('click', async () => {
  await sb.auth.signOut(); session = null; showScreen('login-screen');
});

// Init
(async () => {
  showScreen('loading-screen');
  const { data: { session: s } } = await sb.auth.getSession();
  if (s) {
    session = s;
    document.getElementById('h-email').textContent = s.user.email;
    showScreen('app-screen');
    await loadEndpoints();
  } else {
    showScreen('login-screen');
  }
})();
</script>
</body>
</html>

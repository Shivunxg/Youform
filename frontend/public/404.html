<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{--ink:#111111;--paper:#FCE8A8;--coral:#FF6B4A;--lime:#C3F53B;--b:2.5px solid var(--ink);--sh:5px 5px 0 var(--ink);}
  body{font-family:'Space Grotesk',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;}
  a{color:inherit;text-decoration:none;}
  .nav{border-bottom:var(--b);background:#fff;padding:0 32px;height:60px;display:flex;align-items:center;justify-content:space-between;}
  .logo{display:flex;align-items:center;gap:10px;font-family:'Archivo',sans-serif;font-size:18px;font-weight:900;}
  .logo-mark{width:32px;height:32px;background:var(--ink);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Archivo',sans-serif;font-weight:900;font-size:16px;}
  .main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 24px;}
  .code{font-family:'Archivo',sans-serif;font-size:clamp(80px,18vw,180px);font-weight:900;line-height:1;color:var(--ink);opacity:.08;position:absolute;user-select:none;}
  .content{position:relative;z-index:1;}
  .badge{display:inline-flex;align-items:center;gap:8px;background:#fff;border:var(--b);border-radius:100px;padding:6px 16px;font-size:13px;font-weight:700;margin-bottom:24px;}
  h1{font-family:'Archivo',sans-serif;font-size:clamp(32px,6vw,56px);font-weight:900;line-height:1.1;margin-bottom:16px;}
  p{font-size:18px;color:#555;max-width:420px;line-height:1.6;margin-bottom:36px;}
  .btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:14px 28px;font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:700;border-radius:10px;border:var(--b);box-shadow:var(--sh);cursor:pointer;transition:transform .1s,box-shadow .1s;text-decoration:none;}
  .btn:hover{transform:translate(2px,2px);box-shadow:3px 3px 0 var(--ink);}
  .btn-coral{background:var(--coral);color:#fff;}
  .btn-white{background:#fff;color:var(--ink);}
  .links{margin-top:48px;display:flex;gap:24px;flex-wrap:wrap;justify-content:center;}
  .links a{font-size:14px;font-weight:600;color:#666;border-bottom:2px solid transparent;transition:border-color .15s,color .15s;}
  .links a:hover{color:var(--ink);border-color:var(--ink);}
  footer{border-top:var(--b);padding:20px 32px;text-align:center;font-size:13px;color:#888;font-weight:600;}
</style>
</head>

    <div class="code" aria-hidden="true">404</div>

      <h1>This page doesn't exist.</h1>
      <p>The link might be broken or the page may have been moved. Let's get you back on track.</p>
      <div class="btns">
        <a href="/" class="btn btn-coral">← Back to home</a>
        <a href="/login" class="btn btn-white">Log in to your account</a>
      </div>
      <div class="links">
        <a href="/#features">Features</a>
        <a href="/#pricing">Pricing</a>
        <a href="/#templates">Templates</a>
        <a href="/privacy">Privacy</a>
      </div>
    </div>
  </div>
</main>

<footer>© 2026 FormflowX — Forms people actually finish.</footer>
